<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petualangan Menekuni Hobi - Pixel RPG Kelas V</title>
    <!-- Import Google Pixel Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --pixel-dark: #1e1b4b;
            --pixel-panel: #fef08a;
            --pixel-box: #ffffff;
            --pixel-border: #111827;
            --pixel-accent: #f59e0b;
            --pixel-green: #10b981;
            --pixel-red: #ef4444;
            --pixel-blue: #3b82f6;
            --pixel-shadow: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'VT323', monospace;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #090d16, #1e1b4b);
            color: var(--pixel-border);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        #app {
            width: 100%;
            max-width: 1050px;
            background: #e0f2fe;
            border: 6px solid var(--pixel-border);
            box-shadow: 10px 10px 0px var(--pixel-shadow);
            display: flex;
            flex-direction: column;
            min-height: 720px;
            max-height: 96vh;
            overflow: hidden;
            position: relative;
            animation: appEntrance 0.3s steps(4, end);
        }

        @keyframes appEntrance {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .shake-effect {
            animation: shakeScreen 0.3s steps(2, end) both;
        }

        @keyframes shakeScreen {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-8px, 0); }
            75% { transform: translate(8px, 0); }
        }

        /* RETRO PIXEL HUD */
        .game-hud {
            background: #111827;
            color: #f8fafc;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 6px solid var(--pixel-border);
            z-index: 30;
            flex-wrap: wrap;
            gap: 10px;
        }

        .hud-brand {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.85rem;
            color: #f1c40f;
            text-shadow: 2px 2px 0px #000;
        }

        .hud-stats {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .hud-badge {
            background: #1e293b;
            color: #38bdf8;
            padding: 6px 12px;
            border: 3px solid #38bdf8;
            font-size: 1.3rem;
            font-weight: bold;
            box-shadow: 3px 3px 0px #000;
        }

        .btn-ui {
            background: #fbbf24;
            color: #111827;
            border: 3px solid #111827;
            padding: 6px 12px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.55rem;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
            transition: none;
        }

        .btn-ui:hover { background: #fef08a; }
        .btn-ui:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px #000; }

        /* VIEW CONTAINER */
        .view-content {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
            background: #fdf6e3;
        }

        /* HOME SCREEN PIXEL */
        .home-screen {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            flex: 1;
            background: linear-gradient(180deg, #1e3a8a, #0f172a);
            border: 4px solid var(--pixel-border);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .home-logo-box h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.9rem;
            color: #facc15;
            text-shadow: 4px 4px 0px #000;
            line-height: 1.4;
            margin-bottom: 16px;
        }

        .home-logo-box span {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.75rem;
            color: #e2e8f0;
            background: #3b82f6;
            padding: 8px 14px;
            border: 3px solid #000;
            display: inline-block;
            box-shadow: 3px 3px 0px #000;
        }

        .pixel-menu-card {
            background: #fef08a;
            border: 4px solid var(--pixel-border);
            padding: 24px 32px;
            box-shadow: 6px 6px 0px #000;
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 420px;
            margin-top: 30px;
        }

        .btn-pixel-play {
            background: #22c55e;
            color: #ffffff;
            border: 4px solid #111827;
            padding: 16px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 4px 4px 0px #111827;
            text-shadow: 2px 2px 0px #000;
            transition: none;
            width: 100%;
            text-align: center;
        }

        .btn-pixel-play:hover { background: #16a34a; }
        .btn-pixel-play:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0px #111827; }

        /* QUEST & SLIDES */
        .quest-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 14px 20px;
            border: 4px solid var(--pixel-border);
            box-shadow: 4px 4px 0px var(--pixel-shadow);
        }

        .quest-header h2 {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.75rem;
            color: #1e3a8a;
        }

        .stepper-bar {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .step-dot {
            padding: 6px 10px;
            background: #e2e8f0;
            color: #475569;
            border: 2px solid #0f172a;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .step-dot.active {
            background: #3b82f6;
            color: white;
            box-shadow: 2px 2px 0px #000;
        }

        .npc-dialog-box {
            background: #ffffff;
            border: 4px solid var(--pixel-border);
            box-shadow: 4px 4px 0px var(--pixel-shadow);
            padding: 16px 20px;
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .npc-avatar {
            font-size: 2.5rem;
            background: #fef08a;
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #111827;
            flex-shrink: 0;
            box-shadow: 2px 2px 0px #000;
        }

        .npc-text h4 {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.65rem;
            color: #1e3a8a;
            margin-bottom: 4px;
        }

        .npc-text p {
            font-size: 1.4rem;
            color: #334155;
            line-height: 1.3;
        }

        .quest-card {
            background: #ffffff;
            border: 4px solid var(--pixel-border);
            box-shadow: 4px 4px 0px var(--pixel-shadow);
            padding: 26px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .quest-card h3 {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.8rem;
            color: #b45309;
        }

        .quest-card p, .quest-card li {
            font-size: 1.5rem;
            line-height: 1.5;
            color: #1e293b;
        }

        .highlight-box {
            background: #fef9c3;
            border: 3px dashed #ca8a04;
            padding: 18px;
        }

        .highlight-box h4 {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.65rem;
            color: #854d0e;
            margin-bottom: 8px;
        }

        /* GAME ARENA */
        .game-arena {
            background: #ffffff;
            border: 4px solid var(--pixel-border);
            box-shadow: 4px 4px 0px var(--pixel-shadow);
            padding: 24px;
        }

        .match-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 15px;
        }

        .match-card {
            background: #f8fafc;
            border: 3px solid var(--pixel-border);
            padding: 14px 18px;
            text-align: center;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
            transition: none;
        }

        .match-card:hover:not(.matched) {
            background: #fef08a;
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px #000;
        }

        .match-card.selected {
            background: #fbbf24 !important;
            border-color: #78350f !important;
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000 !important;
        }

        .match-card.matched {
            background: #bbf7d0 !important;
            border-color: #166534 !important;
            color: #14532d !important;
            opacity: 0.7;
            cursor: not-allowed;
            box-shadow: none !important;
        }

        /* PIXEL 3D CHEST */
        .chest-3d-scene {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            margin-top: 10px;
        }

        .chest-box-pixel {
            width: 120px;
            height: 90px;
            background: #92400e;
            border: 4px solid #fef3c7;
            box-shadow: 6px 6px 0px #000, inset 0 4px 0px #d97706;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            position: relative;
        }

        .chest-box-pixel.opened {
            background: #eab308;
            box-shadow: 0 0 25px #facc15, 6px 6px 0px #000;
        }

        .chest-question-box {
            background: #f8fafc;
            border: 3px solid var(--pixel-border);
            padding: 18px;
            width: 100%;
            text-align: center;
            font-size: 1.5rem;
            color: #1e3a8a;
            box-shadow: 3px 3px 0px #000;
        }

        .chest-options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            width: 100%;
        }

        .chest-opt-btn {
            background: #ffffff;
            border: 3px solid var(--pixel-border);
            padding: 12px 18px;
            font-size: 1.4rem;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
            text-align: center;
            transition: none;
        }

        .chest-opt-btn:hover:not(:disabled) {
            background: #fef08a;
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px #000;
        }

        .chest-opt-btn.correct {
            background: #bbf7d0 !important;
            border-color: #166534 !important;
            color: #14532d !important;
            box-shadow: 2px 2px 0px #000 !important;
        }

        .chest-opt-btn.wrong {
            background: #fecaca !important;
            border-color: #991b1b !important;
            color: #7f1d1d !important;
            box-shadow: 2px 2px 0px #000 !important;
        }

        /* ARCADE RACING MINIGAME (GAME 3 WITH ANIMATIONS) */
        .arcade-racing-scene {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .arcade-road {
            width: 100%;
            max-width: 480px;
            height: 260px;
            background: #1e293b;
            background-image: 
                linear-gradient(90deg, transparent 33%, #475569 33%, #475569 36%, transparent 36%),
                linear-gradient(90deg, transparent 66%, #475569 66%, #475569 69%, transparent 69%);
            background-size: 100% 60px;
            animation: scrollRoad 0.3s linear infinite;
            border: 4px solid var(--pixel-border);
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.8);
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding-bottom: 12px;
        }

        @keyframes scrollRoad {
            0% { background-position: 0 0; }
            100% { background-position: 0 60px; }
        }

        .road-lane-zone {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 10px;
            position: relative;
        }

        .lane-answer-tag {
            font-size: 1.1rem;
            color: #fef08a;
            background: #0f172a;
            padding: 4px 6px;
            border: 2px solid #475569;
            text-align: center;
            width: 90%;
            border-radius: 4px;
            box-shadow: 2px 2px 0px #000;
        }

        .car-sprite-arcade {
            font-size: 3rem;
            position: absolute;
            bottom: 10px;
            transition: left 0.15s ease-out;
            animation: carIdle 0.2s infinite alternate;
        }

        @keyframes carIdle {
            from { transform: translateY(0px) scale(1); }
            to { transform: translateY(-3px) scale(1.03); }
        }

        /* Animasi Mobil Benar (Melesat Maju ke Depan / Atas) */
        .car-sprite-arcade.correct-drive {
            animation: carDriveForward 0.8s ease-in-out forwards !important;
        }
        @keyframes carDriveForward {
            0% { transform: translateY(0) scale(1); }
            40% { transform: translateY(-50px) scale(1.2); filter: brightness(1.4); }
            100% { transform: translateY(-180px) scale(0.6); opacity: 0; }
        }

        /* Animasi Mobil Salah (Menabrak, Berputar, & Terpental) */
        .car-sprite-arcade.wrong-crash {
            animation: carCrashSpin 0.7s ease-in-out forwards !important;
        }
        @keyframes carCrashSpin {
            0% { transform: translateX(0) rotate(0deg); }
            20% { transform: translateX(-12px) rotate(-20deg); filter: hue-rotate(90deg) brightness(0.8); }
            40% { transform: translateX(12px) rotate(20deg); }
            60% { transform: translateX(-10px) rotate(-15deg); }
            80% { transform: translateX(5px) rotate(10deg); }
            100% { transform: translateY(20px) rotate(0deg); opacity: 0.6; }
        }

        .racing-controls {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 480px;
            justify-content: center;
        }

        .btn-steer {
            background: #38bdf8;
            color: #0f172a;
            border: 3px solid #111827;
            padding: 12px 16px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.55rem;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
            flex: 1;
            text-align: center;
        }
        .btn-steer:hover { background: #7dd3fc; }
        .btn-steer:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px #000; }

        .btn-boost {
            background: #22c55e;
            color: #ffffff;
            border: 3px solid #111827;
            padding: 12px 20px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.6rem;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
            text-shadow: 1px 1px 0px #000;
            flex: 1.5;
            text-align: center;
        }
        .btn-boost:hover { background: #16a34a; }
        .btn-boost:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px #000; }

        .feedback-banner {
            margin-top: 15px;
            padding: 14px 18px;
            font-size: 1.4rem;
            text-align: center;
            border: 3px solid #000;
            box-shadow: 3px 3px 0px #000;
        }

        .feedback-success { background: #bbf7d0; color: #14532d; border-color: #166534; }
        .feedback-error { background: #fecaca; color: #7f1d1d; border-color: #991b1b; }

        .action-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 3px dashed #cbd5e1;
        }

        .btn-secondary {
            background: #cbd5e1;
            color: #1e293b;
            border: 3px solid #111827;
            padding: 10px 20px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.55rem;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
            border: 3px solid #111827;
            padding: 10px 24px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.55rem;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
            text-shadow: 1px 1px 0px #000;
        }
        .btn-primary:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div id="app"></div>

    <!-- Audio element for music5.mp3 (Volume set to 0.2 so SFX are clearly heard) -->
    <audio id="bgmAudio" src="music5.mp3" loop preload="auto"></audio>

    <script>
        class SoundManager {
            constructor() { 
                this.ctx = null; 
            }
            initCtx() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.ctx.state === 'suspended') this.ctx.resume();
            }
            playClick() {
                try {
                    this.initCtx();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(440, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.05);
                    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(this.ctx.currentTime + 0.05);
                } catch(e){}
            }
            playCorrect() {
                try {
                    this.initCtx();
                    const now = this.ctx.currentTime;
                    [523.25, 659.25, 783.99].forEach((freq, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(freq, now + i * 0.06);
                        gain.gain.setValueAtTime(0.1, now + i * 0.06);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.15);
                        osc.connect(gain); gain.connect(this.ctx.destination);
                        osc.start(now + i * 0.06); osc.stop(now + i * 0.06 + 0.15);
                    });
                } catch(e){}
            }
            playWrong() {
                try {
                    this.initCtx();
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(80, now + 0.2);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(now); osc.stop(now + 0.2);
                } catch(e){}
            }
            playVictory() {
                try {
                    this.initCtx();
                    const now = this.ctx.currentTime;
                    [440, 554.37, 659.25, 880].forEach((freq, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(freq, now + i * 0.08);
                        gain.gain.setValueAtTime(0.12, now + i * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.3);
                        osc.connect(gain); gain.connect(this.ctx.destination);
                        osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.3);
                    });
                } catch(e){}
            }
        }

        const sounds = new SoundManager();

        const missionData = {
            id: 'misi5',
            title: 'MISI 5: KOTAK KATA',
            subtitle: 'Belajar Seru: KBBI, Sinonim, Antonim, & Kalimat Langsung',
            npcGreeting: "Halo, Petualang! Aku Dimas. Mari pelajari materi di bawah ini, lalu selesaikan 3 Mini-Game Piksel (Pasangan Kata, Peti Piksel, & Balap Mobil Pintar) untuk meraih skor 100!",
            steps: [
                { id: 'slide1', label: '1. KBBI' },
                { id: 'slide2', label: '2. Sinonim' },
                { id: 'slide3', label: '3. Kalimat' },
                { id: 'slide4', label: '4. Contoh' },
                { id: 'slide5', label: '5. Ringkas' },
                { id: 'game1', label: '6. Game 1' },
                { id: 'game3dchest', label: '7. Peti 3D 🗝️' },
                { id: 'gameracing', label: '8. Mobil 🚗' }
            ],
            slides: {
                slide1: `
                    <h3>📚 1. Mengenal Kamus Pintar (KBBI)</h3>
                    <p style="margin-bottom: 12px;"><strong>Apa itu KBBI?</strong><br>
                    KBBI (Kamus Besar Bahasa Indonesia) adalah buku kamus resmi tempat mencari arti seluruh kata bahasa Indonesia.</p>
                    <p style="margin-bottom: 12px;"><strong>Cara Mencari Kata:</strong><br>
                    Jika menemukan kata berimbuhan seperti <em>'menekuni'</em> atau <em>'pemberdayaan'</em>, cari dulu kata dasarnya di kamus yaitu <strong>'tekun'</strong> dan <strong>'daya'</strong>.</p>
                `,
                slide2: `
                    <h3>🔍 2. Persamaan (Sinonim) & Lawan (Antonim)</h3>
                    <p style="margin-bottom: 12px;"><strong>1. Persamaan Kata (Sinonim)</strong><br>
                    Sinonim adalah kata berbeda yang artinya sama/mirip. Contoh: <em>'kreatif'</em> artinya mirip dengan <em>'inovatif / banyak ide baru'</em>.</p>
                    <p style="margin-bottom: 12px;"><strong>2. Lawan Kata (Antonim)</strong><br>
                    Antonim adalah kata yang artinya berlawanan. Contoh: lawan kata <em>'giat'</em> adalah <em>'malas'</em>.</p>
                `,
                slide3: `
                    <h3>💬 3. Aturan Menulis Kalimat Langsung</h3>
                    <p style="margin-bottom: 12px;"><strong>Apa itu Kalimat Langsung?</strong><br>
                    Kalimat yang menirukan persis ucapan seseorang tanpa diubah susunan katanya.</p>
                    <p style="margin-bottom: 12px;"><strong>3 Syarat Wajib:</strong><br>
                    • Diapit tanda petik ganda (<strong>"..."</strong>).<br>
                    • Ada tanda koma (<strong>,</strong>) sebelum tanda petik.<br>
                    • Huruf pertama pada ucapan wajib huruf besar.</p>
                `,
                slide4: `
                    <h3>🌟 4. Contoh dalam Cerita Hobi</h3>
                    <div class="highlight-box">
                        <h4>💡 Contoh Kalimat Langsung</h4>
                        <p style="font-style: italic; background: #ffffff; padding: 12px; border: 2px solid #ca8a04; margin-top: 8px; font-size: 1.4rem;">
                        Yuda berkata kepada adiknya, "Gunakanlah barang bekas di rumah untuk membuat kerajinan seni!"
                        </p>
                        <p style="font-size: 1.25rem; color: #475569; margin-top: 8px;">
                        Perhatikan koma, tanda petik, dan huruf kapital 'G' pada kata 'Gunakanlah'.
                        </p>
                    </div>
                `,
                slide5: `
                    <h3>⭐ 5. Rangkuman Piksel</h3>
                    <div class="highlight-box">
                        <h4>✨ 3 Poin Penting Misi 5:</h4>
                        <p style="font-size: 1.4rem; line-height: 1.6; color: #78350f;">
                        1. Cari kata dasar di KBBI untuk kata berimbuhan.<br>
                        2. Sinonim = sama arti, Antonim = beda/lawan arti.<br>
                        3. Kalimat langsung wajib pakai tanda petik & koma.
                        </p>
                    </div>
                `
            }
        };

        const matchGamePairs = [
            { id: 1, word: "Kreatif", match: "Inovatif" },
            { id: 2, word: "Giat", match: "Rajin" },
            { id: 3, word: "Tekun", match: "Ulet" },
            { id: 4, word: "Malas", match: "Lamban" },
            { id: 5, word: "Cepat", match: "Kilat" }
        ];

        const chestQuestions = [
            {
                q: "Peti 1: Apa kata dasar yang harus dicari di KBBI untuk kata 'menekuni'?",
                options: ["Tekunan", "Tekun", "Tekunilah"],
                answer: 1,
                hint: "Hilangkan awalan me- dan akhiran -i."
            },
            {
                q: "Peti 2: Apa persamaan kata (sinonim) dari 'giat'?",
                options: ["Rajin", "Lamban", "Tidur"],
                answer: 0,
                hint: "Orang yang giat pasti rajin bekerja."
            },
            {
                q: "Peti 3: Manakah penulisan tanda baca kalimat langsung yang paling benar?",
                options: [
                    'Budi berkata "Saya suka membaca."',
                    'Budi berkata, "Saya suka membaca."',
                    'Budi berkata: Saya suka membaca.'
                ],
                answer: 1,
                hint: "Harus ada tanda koma sebelum tanda petik."
            },
            {
                q: "Peti 4: Apa arti dari kata 'kosakata' di dalam KBBI?",
                options: ["Daftar belanjaan", "Perbendaharaan kata", "Buku cerita"],
                answer: 1,
                hint: "Berkaitan dengan perbendaharaan kata bahasa."
            },
            {
                q: "Peti 5: Apa antonim (lawan kata) dari kata 'pintar'?",
                options: ["Cerdas", "Bodoh", "Rajin"],
                answer: 1,
                hint: "Lawan dari pintar adalah bodoh."
            }
        ];

        const racingQuestions = [
            {
                q: "Mobil 1: Apa sinonim (persamaan kata) dari 'pandai'?",
                options: ["Bodoh", "Cerdas", "Malas"],
                answer: 1
            },
            {
                q: "Mobil 2: Cari kata dasar dari kata 'pemberdayaan'!",
                options: ["Daya", "Pemberdaya", "Berdaya"],
                answer: 0
            },
            {
                q: "Mobil 3: Lawan kata (antonim) dari kata 'rajin' adalah...?",
                options: ["Ulet", "Giat", "Malas"],
                answer: 2
            }
        ];

        let state = {
            screen: 'home',
            stepIndex: 0,
            stars: 0,
            totalScore: 0,
            // Game 1
            selectedLeftId: null,
            matchedIds: [],
            shuffledLeft: [],
            shuffledRight: [],
            gameMsg: null,
            // Game 2 (Chest)
            chestIndex: 0,
            chestOpened: false,
            chestAnswered: false,
            chestMsg: null,
            selectedChestOpt: null,
            // Game 3 (Arcade Racing)
            racingIndex: 0,
            carLane: 1, // 0: Kiri, 1: Tengah, 2: Kanan
            racingAnswered: false,
            racingMsg: null,
            isCorrectAnswer: false
        };

        function startBGM() {
            const audio = document.getElementById('bgmAudio');
            if (audio) {
                audio.volume = 0.2; 
                audio.play().catch(e => console.log("Autoplay blocked:", e));
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert("Error: " + err.message);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function handleBGM() {
            const audio = document.getElementById('bgmAudio');
            const btn = document.getElementById('bgmBtn');
            if (audio.paused) {
                audio.volume = 0.2;
                audio.play();
                if (btn) {
                    btn.innerText = "🎵 BGM: ON";
                    btn.style.background = "#22c55e";
                }
            } else {
                audio.pause();
                if (btn) {
                    btn.innerText = "🔇 BGM: OFF";
                    btn.style.background = "#fbbf24";
                }
            }
        }

        function initMatchGame() {
            state.shuffledLeft = [...matchGamePairs].sort(() => Math.random() - 0.5);
            state.shuffledRight = [...matchGamePairs].sort(() => Math.random() - 0.5);
            state.selectedLeftId = null;
            state.matchedIds = [];
            state.gameMsg = null;
        }

        function initChestGame() {
            state.chestIndex = 0;
            state.chestOpened = false;
            state.chestAnswered = false;
            state.chestMsg = null;
            state.selectedChestOpt = null;
        }

        function initRacingGame() {
            state.racingIndex = 0;
            state.carLane = 1;
            state.racingAnswered = false;
            state.racingMsg = null;
            state.isCorrectAnswer = false;
        }

        function triggerShake() {
            const arena = document.getElementById('arenaBox');
            if (arena) {
                arena.classList.add('shake-effect');
                setTimeout(() => arena.classList.remove('shake-effect'), 300);
            }
        }

        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (state.screen !== 'home') {
                app.appendChild(createHUD());
            }

            const container = document.createElement('div');
            container.className = 'view-content';

            if (state.screen === 'home') {
                container.innerHTML = `
                    <div class="home-screen">
                        <div class="home-logo-box">
                            <h1>KOTAK KATA</h1>
                            <span>PIXEL RPG - KELAS V</span>
                        </div>
                        <div class="pixel-menu-card">
                            <h2 style="font-family: 'Press Start 2P'; color: #1e3a8a; font-size: 0.95rem; text-align: center;">SIAP BERPETUALANG?</h2>
                            <button class="btn-pixel-play" onclick="sounds.playClick(); startBGM(); startMission()">
                                MULAI MISI 🎮
                            </button>
                        </div>
                    </div>
                `;
            } else if (state.screen === 'learning') {
                const currentStep = missionData.steps[state.stepIndex];
                const isGame1 = currentStep.id === 'game1';
                const isGameChest = currentStep.id === 'game3dchest';
                const isGameRacing = currentStep.id === 'gameracing';

                const stepperHtml = `
                    <div class="stepper-bar">
                        ${missionData.steps.map((s, idx) => `
                            <div class="step-dot ${state.stepIndex === idx ? 'active' : ''}">
                                ${idx + 1}
                            </div>
                        `).join('')}
                    </div>
                `;

                if (isGame1) {
                    if (state.shuffledLeft.length === 0) initMatchGame();
                    const isAllMatched = state.matchedIds.length === matchGamePairs.length;

                    container.innerHTML = `
                        <div class="quest-header">
                            <h2>🎮 GAME 1: PASANGAN KATA</h2>
                            <span style="font-family: 'Press Start 2P'; font-size: 0.65rem; color: #16a34a;">BENAR: ${state.matchedIds.length}/5</span>
                        </div>
                        ${stepperHtml}
                        <div class="game-arena" id="arenaBox">
                            <p style="font-weight: bold; color: #1e3a8a; margin-bottom: 12px; font-size: 1.4rem;">
                                🧩 Klik kata kiri, lalu pasangannya di kanan! (+34 Poin total Game 1). Salah? Jawaban benar otomatis muncul.
                            </p>
                            <div class="match-grid">
                                <div style="display: flex; flex-direction: column; gap: 10px;">
                                    <h4 style="font-family: 'Press Start 2P'; color: #1e3a8a; font-size: 0.65rem; text-align: center;">KATA ASAL</h4>
                                    ${state.shuffledLeft.map(item => {
                                        const matched = state.matchedIds.includes(item.id);
                                        const selected = state.selectedLeftId === item.id;
                                        let cls = "match-card";
                                        if (matched) cls += " matched";
                                        else if (selected) cls += " selected";
                                        return `<div class="${cls}" ${matched ? '' : `onclick="clickLeft(${item.id})"`}>${item.word}</div>`;
                                    }).join('')}
                                </div>
                                <div style="display: flex; flex-direction: column; gap: 10px;">
                                    <h4 style="font-family: 'Press Start 2P'; color: #1e3a8a; font-size: 0.65rem; text-align: center;">ARTINYA</h4>
                                    ${state.shuffledRight.map(item => {
                                        const matched = state.matchedIds.includes(item.id);
                                        let cls = "match-card";
                                        if (matched) cls += " matched";
                                        return `<div class="${cls}" ${matched ? '' : `onclick="clickRight(${item.id})"`}>${item.match}</div>`;
                                    }).join('')}
                                </div>
                            </div>
                            ${state.gameMsg ? `<div class="feedback-banner ${state.gameMsg.success ? 'feedback-success' : 'feedback-error'}">${state.gameMsg.text}</div>` : ''}
                        </div>
                        <div class="action-footer">
                            <button class="btn-secondary" onclick="sounds.playClick(); prevStep()">« KEMBALI</button>
                            ${isAllMatched ? `<button class="btn-primary" onclick="sounds.playClick(); nextStep()">LANJUT PETI »</button>` : '<div></div>'}
                        </div>
                    `;
                } else if (isGameChest) {
                    const currentQ = chestQuestions[state.chestIndex];
                    container.innerHTML = `
                        <div class="quest-header">
                            <h2>🗝️ GAME 2: PETI PIKSEL</h2>
                            <span style="font-family: 'Press Start 2P'; font-size: 0.65rem; color: #b45309;">PETI ${state.chestIndex + 1}/5</span>
                        </div>
                        ${stepperHtml}
                        <div class="game-arena" id="arenaBox">
                            <div class="chest-3d-scene">
                                <div class="chest-box-pixel ${state.chestOpened ? 'opened' : ''}">
                                    ${state.chestOpened ? '🎁' : '📦'}
                                </div>
                                <div class="chest-question-box">${currentQ.q}</div>
                                <div class="chest-options-grid">
                                    ${currentQ.options.map((opt, idx) => {
                                        let btnCls = "chest-opt-btn";
                                        if (state.selectedChestOpt !== null) {
                                            if (idx === currentQ.answer) btnCls += " correct";
                                            else if (idx === state.selectedChestOpt) btnCls += " wrong";
                                        }
                                        return `<button class="${btnCls}" ${state.selectedChestOpt !== null ? 'disabled' : ''} onclick="answerChest(${idx})">${opt}</button>`;
                                    }).join('')}
                                </div>
                            </div>
                            ${state.chestMsg ? `<div class="feedback-banner ${state.chestMsg.success ? 'feedback-success' : 'feedback-error'}">${state.chestMsg.text}</div>` : ''}
                        </div>
                        <div class="action-footer">
                            <button class="btn-secondary" onclick="sounds.playClick(); prevStep()">« KEMBALI</button>
                            ${state.chestAnswered ? `<button class="btn-primary" onclick="sounds.playClick(); nextChestQuestion()">LANJUT MOBIL »</button>` : '<div></div>'}
                        </div>
                    `;
                } else if (isGameRacing) {
                    const currentQ = racingQuestions[state.racingIndex];
                    const carLeftPercent = [16, 50, 84][state.carLane];

                    // Tentukan kelas animasi mobil berdasarkan status jawaban
                    let carAnimClass = "";
                    if (state.racingAnswered) {
                        carAnimClass = state.isCorrectAnswer ? "correct-drive" : "wrong-crash";
                    }

                    container.innerHTML = `
                        <div class="quest-header">
                            <h2>🚗 GAME 3: MOBIL BALAP PINTAR</h2>
                            <span style="font-family: 'Press Start 2P'; font-size: 0.65rem; color: #3b82f6;">SOAL ${state.racingIndex + 1}/3</span>
                        </div>
                        ${stepperHtml}
                        <div class="game-arena" id="arenaBox">
                            <div class="arcade-racing-scene">
                                <div style="font-weight: bold; color: #1e3a8a; font-size: 1.4rem; text-align: center;">${currentQ.q}</div>
                                <div class="arcade-road">
                                    <div class="road-lane-zone">
                                        <div class="lane-answer-tag">${currentQ.options[0]}</div>
                                    </div>
                                    <div class="road-lane-zone">
                                        <div class="lane-answer-tag">${currentQ.options[1]}</div>
                                    </div>
                                    <div class="road-lane-zone">
                                        <div class="lane-answer-tag">${currentQ.options[2]}</div>
                                    </div>
                                    <div class="car-sprite-arcade ${carAnimClass}" style="left: ${carLeftPercent}%; transform: translateX(-50%);">
                                        🏎️
                                    </div>
                                </div>
                                <div class="racing-controls">
                                    <button class="btn-steer" ${state.racingAnswered ? 'disabled' : ''} onclick="moveCar(-1)">◀ KIRI</button>
                                    <button class="btn-boost" ${state.racingAnswered ? 'disabled' : ''} onclick="submitRacing()">TEROBOS! 🚀</button>
                                    <button class="btn-steer" ${state.racingAnswered ? 'disabled' : ''} onclick="moveCar(1)">KANAN ▶</button>
                                </div>
                            </div>
                            ${state.racingMsg ? `<div class="feedback-banner ${state.racingMsg.success ? 'feedback-success' : 'feedback-error'}">${state.racingMsg.text}</div>` : ''}
                        </div>
                        <div class="action-footer">
                            <button class="btn-secondary" onclick="sounds.playClick(); prevStep()">« KEMBALI</button>
                            ${state.racingAnswered ? `<button class="btn-primary" onclick="sounds.playClick(); nextRacingQuestion()">${state.racingIndex === racingQuestions.length - 1 ? 'LIHAT SKOR AKHIR 🏆' : 'SOAL BERIKUTNYA »'}</button>` : '<div></div>'}
                        </div>
                    `;
                } else {
                    const slideContent = missionData.slides[currentStep.id];
                    container.innerHTML = `
                        <div class="quest-header">
                            <h2>📚 ${missionData.title}</h2>
                            <span style="font-family: 'Press Start 2P'; font-size: 0.65rem; color: #1e3a8a;">${currentStep.label}</span>
                        </div>
                        ${stepperHtml}
                        <div class="npc-dialog-box">
                            <div class="npc-avatar">🧙‍♂️</div>
                            <div class="npc-text">
                               <h4>PESAN DIMAS:</h4>
                               <p>${missionData.npcGreeting}</p>
                            </div>
                        </div>
                        <div class="quest-card">
                            <div>${slideContent}</div>
                        </div>
                        <div class="action-footer">
                            <button class="btn-secondary" onclick="sounds.playClick(); prevStep()">
                                « ${state.stepIndex > 0 ? 'KEMBALI' : 'BERANDA'}
                            </button>
                            <button class="btn-primary" onclick="sounds.playClick(); nextStep()">
                                LANJUT »
                            </button>
                        </div>
                    `;
                }
            } else if (state.screen === 'success') {
                container.innerHTML = `
                    <div style="text-align: center; display: flex; flex-direction: column; gap: 20px; align-items: center; padding: 30px;">
                        <div style="font-size: 5rem;">🏆⭐</div>
                        <h2 style="font-family: 'Press Start 2P'; color: #1e3a8a; font-size: 1.4rem; text-shadow: 2px 2px 0px #000;">MISI SELESAI!</h2>
                        <p style="font-size: 1.6rem; color: #334155;">Hebat! Kamu telah menuntaskan seluruh materi & 3 mini-game.</p>
                        
                        <div style="background: #fef08a; border: 4px solid #111827; padding: 24px; width: 100%; max-width: 420px; box-shadow: 6px 6px 0px #000; display: flex; flex-direction: column; gap: 12px;">
                            <h3 style="font-family: 'Press Start 2P'; font-size: 0.8rem; color: #b45309;">NILAI AKHIR KAMU</h3>
                            <p style="font-size: 3.5rem; font-weight: bold; color: #16a34a; font-family: 'Press Start 2P'; text-shadow: 2px 2px 0px #000;">${state.totalScore}<span style="font-size: 1.2rem; color: #111827;">/100</span></p>
                            <p style="font-size: 1.3rem; color: #111827; font-weight: bold;">⭐ +1 Bintang Berhasil Ditambahkan!</p>
                        </div>

                        <div style="display: flex; gap: 14px; margin-top: 10px;">
                            <button class="btn-secondary" onclick="sounds.playClick(); startMission()">ULANGI 🔄</button>
                            <button class="btn-primary" onclick="sounds.playClick(); goHome()">BERANDA 🏠</button>
                        </div>
                    </div>
                `;
            }

            app.appendChild(container);
        }

        function createHUD() {
            const hud = document.createElement('div');
            hud.className = 'game-hud';
            const audio = document.getElementById('bgmAudio');
            const isPlaying = audio && !audio.paused;
            hud.innerHTML = `
                <div class="hud-brand">
                    <span>⚔️ KOTAK KATA V</span>
                </div>
                <div class="hud-stats">
                    <button class="btn-ui" id="bgmBtn" onclick="handleBGM()">${isPlaying ? "🎵 BGM: ON" : "🔇 BGM: OFF"}</button>
                    <button class="btn-ui" onclick="toggleFullscreen()">⛶ FULL</button>
                    <div class="hud-badge">
                        <span>SKOR: ${state.totalScore}</span>
                    </div>
                    <div class="hud-badge">
                        <span>⭐ ${state.stars}</span>
                    </div>
                    <button class="btn-ui" onclick="sounds.playClick(); goHome()">HOME</button>
                </div>
            `;
            return hud;
        }

        function goHome() { state.screen = 'home'; render(); }
        function startMission() {
            startBGM();
            state.screen = 'learning';
            state.stepIndex = 0;
            state.totalScore = 0;
            initMatchGame();
            initChestGame();
            initRacingGame();
            render();
        }
        function nextStep() {
            if (state.stepIndex < missionData.steps.length - 1) {
                state.stepIndex++;
                if (missionData.steps[state.stepIndex].id === 'game1') {
                    initMatchGame();
                } else if (missionData.steps[state.stepIndex].id === 'game3dchest') {
                    initChestGame();
                } else if (missionData.steps[state.stepIndex].id === 'gameracing') {
                    initRacingGame();
                }
                render();
            }
        }
        function prevStep() {
            if (state.stepIndex > 0) {
                state.stepIndex--;
                render();
            } else {
                goHome();
            }
        }

        window.clickLeft = function(id) {
            sounds.playClick();
            state.selectedLeftId = id;
            state.gameMsg = { success: true, text: "Kata dipilih! Sekarang pilih pasangannya di kanan." };
            render();
        };

        window.clickRight = function(id) {
            if (state.selectedLeftId === null) {
                sounds.playWrong();
                state.gameMsg = { success: false, text: "⚠️ Pilih dulu kata di sebelah kiri!" };
                render();
                return;
            }

            if (state.selectedLeftId === id) {
                sounds.playCorrect();
                state.matchedIds.push(id);
                state.selectedLeftId = null;
                state.totalScore += 7;
                if (state.matchedIds.length === matchGamePairs.length) {
                    sounds.playVictory();
                    state.gameMsg = { success: true, text: "🏆 Yey! Semua pasangan kata tepat." };
                } else {
                    state.gameMsg = { success: true, text: "🎉 Benar! Pintar sekali (+7 Poin)." };
                }
            } else {
                sounds.playWrong();
                triggerShake();
                const correctWord = matchGamePairs.find(p => p.id === state.selectedLeftId).word;
                const correctMatch = matchGamePairs.find(p => p.id === state.selectedLeftId).match;
                
                state.matchedIds.push(state.selectedLeftId);
                state.selectedLeftId = null;

                if (state.matchedIds.length === matchGamePairs.length) {
                    sounds.playVictory();
                    state.gameMsg = { success: false, text: `❌ Kurang tepat. Pasangan benar: "${correctWord}" = "${correctMatch}".` };
                } else {
                    state.gameMsg = { success: false, text: `❌ Kurang tepat. "${correctWord}" = "${correctMatch}" (Otomatis dicocokkan).` };
                }
            }
            render();
        };

        window.answerChest = function(idx) {
            const currentQ = chestQuestions[state.chestIndex];
            state.selectedChestOpt = idx;
            state.chestAnswered = true;

            if (idx === currentQ.answer) {
                sounds.playCorrect();
                state.chestOpened = true;
                state.totalScore += 7;
                state.chestMsg = { success: true, text: "🎉 Benar! Peti terbuka (+7 Poin)." };
                render();
            } else {
                sounds.playWrong();
                triggerShake();
                state.chestOpened = false;
                state.chestMsg = { success: false, text: `❌ Kurang tepat! Jawaban benar: "${currentQ.options[currentQ.answer]}"` };
                render();
            }
        };

        window.nextChestQuestion = function() {
            state.chestIndex++;
            if (state.chestIndex >= chestQuestions.length) {
                nextStep();
            } else {
                state.chestOpened = false;
                state.chestAnswered = false;
                state.selectedChestOpt = null;
                state.chestMsg = null;
                render();
            }
        };

        // Kontrol Interaktif Game Mobil Balap Arcade dengan Animasi Benar/Salah
        window.moveCar = function(dir) {
            if (state.racingAnswered) return;
            sounds.playClick();
            state.carLane = Math.max(0, Math.min(2, state.carLane + dir));
            render();
        };

        window.submitRacing = function() {
            if (state.racingAnswered) return;
            const currentQ = racingQuestions[state.racingIndex];
            state.racingAnswered = true;

            if (state.carLane === currentQ.answer) {
                sounds.playCorrect();
                state.isCorrectAnswer = true;
                state.totalScore += 11;
                state.racingMsg = { success: true, text: "🏎️ Wussh! Mobil melesat maju melewati jalur yang benar (+11 Poin)." };
                render();
            } else {
                sounds.playWrong();
                triggerShake();
                state.isCorrectAnswer = false;
                state.racingMsg = { success: false, text: `💥 Gubrak! Mobil menabrak! Jawaban benar di jalur ${currentQ.answer + 1}: "${currentQ.options[currentQ.answer]}"` };
                render();
            }
        };

        window.nextRacingQuestion = function() {
            state.racingIndex++;
            if (state.racingIndex >= racingQuestions.length) {
                finishMission();
            } else {
                state.carLane = 1;
                state.racingAnswered = false;
                state.racingMsg = null;
                state.isCorrectAnswer = false;
                render();
            }
        };

        // Keyboard Support untuk Game Mobil (Panah Kiri/Kanan & Enter untuk Terobos)
        window.addEventListener('keydown', (e) => {
            if (state.screen === 'learning' && missionData.steps[state.stepIndex].id === 'gameracing') {
                if (e.key === 'ArrowLeft') moveCar(-1);
                if (e.key === 'ArrowRight') moveCar(1);
                if (e.key === 'Enter' && !state.racingAnswered) submitRacing();
            }
        });

        function finishMission() {
            state.totalScore = Math.min(100, state.totalScore);
            state.stars += 1;
            state.screen = 'success';
            sounds.playVictory();
            render();
        }

        window.onload = function() { render(); };
    </script>
</body>
</html>
